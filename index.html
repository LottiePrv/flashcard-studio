<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie flashcard</title>
<style>
:root { color-scheme: light; --ink:#202124; --muted:#687078; --accent:#6750a4; --paper:#fff; --bg:#f5f3f8; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:Arial,Helvetica,sans-serif; display:flex; justify-content:center; padding:36px 16px; }
main { width:min(720px,100%); text-align:center; }
h1 { font-size:clamp(1.5rem,4vw,2rem); margin:8px 0; }
#status { color:var(--muted); margin:12px 0 18px; font-size:.95rem; }
.progress { height:6px; background:#e3deeb; border-radius:99px; overflow:hidden; margin:0 0 22px; }
#bar { height:100%; width:0; background:var(--accent); transition:width .2s; }
.card { min-height:290px; background:var(--paper); border:1px solid #e7e2ed; border-radius:22px; box-shadow:0 8px 28px #29203912; padding:34px 28px; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; user-select:none; transition:transform .18s, box-shadow .18s; }
.card:active { transform:scale(.99); }
.eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:700; margin-bottom:18px; }
#cardText { font-size:clamp(1.2rem,3.2vw,1.65rem); line-height:1.5; white-space:pre-wrap; }
.hint { color:var(--muted); font-size:.85rem; margin-top:24px; }
.controls { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:20px; }
button { border:0; border-radius:999px; padding:12px 20px; font-size:.95rem; font-weight:600; cursor:pointer; background:#e9e3f2; color:#392b55; }
button.primary { background:var(--accent); color:white; }
button:disabled { opacity:.4; cursor:not-allowed; }
#message { color:#a33; margin-top:20px; }
@media(max-width:480px){ body{padding:22px 12px} .card{min-height:260px;padding:26px 20px} }
</style>
</head>
<body>
<main>
  <h1>Le mie flashcard</h1>
  <div id="status">Caricamento delle carte…</div>
  <div class="progress"><div id="bar"></div></div>
  <section class="card" id="card" role="button" tabindex="0" aria-label="Mostra la risposta">
    <div class="eyebrow" id="side">Domanda</div>
    <div id="cardText"></div>
    <div class="hint" id="hint">Clicca sulla carta per vedere la risposta</div>
  </section>
  <div class="controls">
    <button id="prev">← Indietro</button>
    <button class="primary" id="flip">Mostra risposta</button>
    <button id="next">Avanti →</button>
  </div>
  <div class="controls">
    <button id="shuffle">Mescola le carte</button>
  </div>
  <div id="message"></div>
</main>
<script>
const cardText = document.getElementById('cardText');
const side = document.getElementById('side');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const message = document.getElementById('message');
let cards = [], index = 0, showingAnswer = false;

function parseCSV(text) {
  const rows=[]; let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted){
      if(c === '"' && n === '"'){ field+='"'; i++; }
      else if(c === '"') quoted=false;
      else field+=c;
    } else {
      if(c === '"' && field.length===0) quoted=true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && n === '\n') i++;
        row.push(field); field='';
        if(row.some(v=>v.trim())) rows.push(row);
        row=[];
      } else field+=c;
    }
  }
  row.push(field);
  if(row.some(v=>v.trim())) rows.push(row);
  return rows;
}
function render(){
  if(!cards.length) return;
  const c=cards[index];
  side.textContent=showingAnswer?'Risposta':'Domanda';
  cardText.textContent=showingAnswer?c[1]:c[0];
  hint.textContent=showingAnswer?'Clicca per tornare alla domanda':'Clicca sulla carta per vedere la risposta';
  statusEl.textContent=`Carta ${index+1} di ${cards.length}`;
  bar.style.width=`${((index+1)/cards.length)*100}%`;
  document.getElementById('prev').disabled=index===0;
  document.getElementById('next').disabled=index===cards.length-1;
  document.getElementById('flip').textContent=showingAnswer?'Mostra domanda':'Mostra risposta';
}
function flip(){ showingAnswer=!showingAnswer; render(); }
function move(step){ index=Math.max(0,Math.min(cards.length-1,index+step)); showingAnswer=false; render(); }
document.getElementById('card').addEventListener('click',flip);
document.getElementById('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
document.getElementById('flip').addEventListener('click',flip);
document.getElementById('prev').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
document.getElementById('shuffle').addEventListener('click',()=>{
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  index=0; showingAnswer=false; render();
});
fetch('./flashcards.csv')
  .then(r=>{if(!r.ok) throw new Error('File CSV non trovato'); return r.text();})
  .then(text=>{
    cards=parseCSV(text).filter(r=>r.length>=2 && r[0].trim() && r[1].trim());
    if(!cards.length) throw new Error('Non trovo coppie domanda/risposta nel CSV.');
    render();
  })
  .catch(err=>{statusEl.textContent='Impossibile caricare le flashcard.';message.textContent=err.message;});
</script>
</body>
</html>
